<!DOCTYPE html>
<html>
<head>
    <title>Voice Profile API Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        button { padding: 10px 20px; margin: 10px 5px; background: #0A8F86; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #087a72; }
        .result { margin: 20px 0; padding: 15px; background: #f5f5f5; border-radius: 5px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; }
        pre { background: white; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🧪 Voice Profile API Test</h1>
    <p>Testing the ElevenLabs voice profile automation from browser</p>
    
    <button onclick="testCreateProfile()">Test 1: Create New Profile</button>
    <button onclick="testUpdateProfile()">Test 2: Update Profile</button>
    <button onclick="testWithUserId()">Test 3: Update with User ID</button>
    
    <div id="result"></div>
    
    <script>
        const API_URL = 'https://junction2025-backend-1087825056058.europe-north1.run.app';
        let createdUserId = null;
        
        async function testCreateProfile() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Creating profile...</p>';
            
            try {
                const response = await fetch(`${API_URL}/api/users/voice-profile`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        voice_profile_id: `voice_${Date.now()}`,
                        full_name: 'Test User from Browser',
                        age: 30,
                        tagline: 'Test tagline',
                        location: 'Helsinki, Finland',
                        hobbies: ['Reading', 'Coding'],
                        career_highlights: [{ company: 'Test Corp', title: 'Developer', years: '2020-2024' }],
                        achievements: ['Test Achievement']
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    createdUserId = data.id;
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h3>✅ Profile Created Successfully!</h3>
                            <p><strong>User ID:</strong> ${data.id}</p>
                            <p><strong>Voice Profile ID:</strong> ${data.voice_profile_id}</p>
                            <p><strong>Name:</strong> ${data.full_name}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    throw new Error(data.error || 'Failed to create profile');
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
        
        async function testUpdateProfile() {
            if (!createdUserId) {
                alert('Please create a profile first (Test 1)');
                return;
            }
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Updating profile...</p>';
            
            try {
                const response = await fetch(`${API_URL}/api/users/voice-profile`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: createdUserId,
                        voice_profile_id: `voice_updated_${Date.now()}`,
                        full_name: 'Updated Test User',
                        age: 31,
                        tagline: 'Updated tagline',
                        location: 'Espoo, Finland',
                        hobbies: ['Reading', 'Coding', 'Swimming']
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h3>✅ Profile Updated Successfully!</h3>
                            <p><strong>User ID:</strong> ${data.id}</p>
                            <p><strong>Updated Voice Profile ID:</strong> ${data.voice_profile_id}</p>
                            <p><strong>Updated Age:</strong> ${data.age}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    throw new Error(data.error || 'Failed to update profile');
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
        
        async function testWithUserId() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Testing with existing user ID...</p>';
            
            // Use a known user ID or create one
            const testUserId = createdUserId || 18;
            
            try {
                const response = await fetch(`${API_URL}/api/users/voice-profile`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: testUserId,
                        voice_profile_id: `voice_re_record_${Date.now()}`,
                        full_name: 'Re-recorded Profile',
                        age: 70,
                        tagline: 'Re-recorded via ElevenLabs',
                        hobbies: ['Woodworking', 'Photography']
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h3>✅ Re-record Test Successful!</h3>
                            <p>This simulates clicking "Re-record" button in ProfileScreen</p>
                            <p><strong>User ID:</strong> ${data.id}</p>
                            <p><strong>Voice Profile ID:</strong> ${data.voice_profile_id}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    throw new Error(data.error || 'Failed to update profile');
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
